# kubectl apply -f deploy/k8s/mossflux.yaml
# One replica holds the whole index in RAM (about 5 GiB for ChEMBL 37).
# More replicas need a ReadWriteMany volume (each replica loads the same file).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mossflux-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mossflux
  labels: {app: mossflux}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mossflux}
  template:
    metadata:
      labels: {app: mossflux}
    spec:
      initContainers:
        - name: fetch
          image: curlimages/curl:8.11.1
          command: ["sh", "-c"]
          args:
            - test -s /data/chembl_37_chemreps.txt.gz || (curl -fL --retry 3 -o /data/c.part "$URL" && mv /data/c.part /data/chembl_37_chemreps.txt.gz)
          env:
            - name: URL
              value: https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/releases/chembl_37/chembl_37_chemreps.txt.gz
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: mossflux
          image: loruorg/mossflux:latest
          args: ["serve"]
          env:
            - {name: MOSSFLUX_DB, value: chembl=/data/chembl_37_chemreps.txt.gz}
            - {name: MOSSFLUX_THREADS, value: "4"}
            - {name: RUST_LOG, value: info}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 50051}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: "2", memory: 6Gi}
            limits: {memory: 8Gi}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts: [{name: data, mountPath: /data, readOnly: true}]
      securityContext:
        fsGroup: 65532
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mossflux-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mossflux
spec:
  selector: {app: mossflux}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 50051, targetPort: grpc, appProtocol: kubernetes.io/h2c}
